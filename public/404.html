<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Weather Station Not Found | MAUSAM</title>
  <meta name="description" content="The requested meteorological telemetry endpoint does not exist on MAUSAM.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/consent.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0B0C0D;
      color: #F0EEE7;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background-color: #191C1D;
      border: 1px solid rgba(226, 219, 200, 0.14);
      border-radius: 15px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 44px rgba(0,0,0,0.55);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(197, 164, 109, 0.14);
      border: 1px solid rgba(197, 164, 109, 0.34);
      border-radius: 7px;
      color: #C5A46D;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 64px;
      font-weight: 800;
      font-family: "IBM Plex Mono", monospace;
      color: #F0EEE7;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #F0EEE7;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #C1BFB5;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    a.btn-primary {
      background-color: #C5A46D;
      color: #0B0C0D;
    }
    a.btn-primary:hover {
      background-color: #E0C18A;
    }
    a.btn-secondary {
      background-color: #202424;
      color: #F0EEE7;
      border: 1px solid rgba(226, 219, 200, 0.22);
    }
    a.btn-secondary:hover {
      background-color: #292E2D;
      color: #F0EEE7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 • ROUTE UNRESOLVED</div>
    <h1>404</h1>
    <h2>Weather station not found.</h2>
    <p>The page or observatory data stream you are looking for does not exist on the MAUSAM server.</p>
    <div class="btn-row">
      <a href="/" class="btn btn-primary">Back to MAUSAM</a>
      <a href="/weather" class="btn btn-secondary">Check Weather</a>
    </div>
  </div>
</body>
</html>
