<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0D" />
      <stop offset="55%" stop-color="#191C1D" />
      <stop offset="100%" stop-color="#111314" />
    </linearGradient>
    <linearGradient id="brass-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A46D" />
      <stop offset="55%" stop-color="#89977B" />
      <stop offset="100%" stop-color="#A7C5C5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Top Observatory Rule -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#brass-bar)" />

  <!-- Radar Rings Graphic (Right side) -->
  <g transform="translate(880, 315)">
    <circle r="260" fill="none" stroke="rgba(226, 219, 200, 0.14)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="190" fill="none" stroke="rgba(226, 219, 200, 0.16)" stroke-width="1.5"/>
    <circle r="120" fill="none" stroke="rgba(197, 164, 109, 0.35)" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#A7C5C5" stroke-width="2" opacity="0.65"/>
    <circle r="8" fill="#C5A46D"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke="rgba(226, 219, 200, 0.12)" stroke-width="1"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke="rgba(226, 219, 200, 0.12)" stroke-width="1"/>
    <!-- Radar beam sweep simulation -->
    <path d="M 0 0 L 130 -160 A 210 210 0 0 1 200 -70 Z" fill="#A7C5C5" opacity="0.14"/>
    <text x="0" y="295" text-anchor="middle" fill="#898B83" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2">DOPPLER RADAR NETWORK • 500KM RANGE</text>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(90, 110)">
    <!-- Observatory Badge -->
    <rect x="0" y="0" width="460" height="34" rx="7" fill="#202424" stroke="rgba(226, 219, 200, 0.18)" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#89977B"/>
    <text x="32" y="22" fill="#C5A46D" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">THE ATMOSPHERIC OBSERVATORY • INDIA</text>

    <!-- Brand Name -->
    <text x="0" y="125" fill="#F0EEE7" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="2">MAUSAM</text>
    <text x="395" y="75" fill="#C5A46D" font-family="system-ui, sans-serif" font-size="18" font-weight="700">मौसम</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#F0EEE7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">
      Atmospheric Telemetry &amp; Agromet Advisory Platform
    </text>
    <text x="0" y="210" fill="#C1BFB5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Real-time observations across 36 States &amp; UTs • NDMA SACHET disaster warnings
    </text>

    <!-- 4 Capability Badges -->
    <g transform="translate(0, 260)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="130" height="60" rx="11" fill="#191C1D" stroke="rgba(226, 219, 200, 0.16)" stroke-width="1"/>
      <text x="14" y="26" fill="#A7C5C5" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">RADAR</text>
      <text x="14" y="47" fill="#F0EEE7" font-family="system-ui" font-size="14" font-weight="600">Doppler Live</text>

      <!-- Card 2 -->
      <rect x="145" y="0" width="130" height="60" rx="11" fill="#191C1D" stroke="rgba(226, 219, 200, 0.16)" stroke-width="1"/>
      <text x="159" y="26" fill="#D8B14F" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">ALERTS</text>
      <text x="159" y="47" fill="#F0EEE7" font-family="system-ui" font-size="14" font-weight="600">NDMA CAP</text>

      <!-- Card 3 -->
      <rect x="290" y="0" width="130" height="60" rx="11" fill="#191C1D" stroke="rgba(226, 219, 200, 0.16)" stroke-width="1"/>
      <text x="304" y="26" fill="#89977B" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">AIR QUALITY</text>
      <text x="304" y="47" fill="#F0EEE7" font-family="system-ui" font-size="14" font-weight="600">CPCB NAQI</text>

      <!-- Card 4 -->
      <rect x="435" y="0" width="130" height="60" rx="11" fill="#191C1D" stroke="rgba(226, 219, 200, 0.16)" stroke-width="1"/>
      <text x="449" y="26" fill="#C5A46D" font-family="system-ui" font-size="11" font-weight="700" letter-spacing="1">AGROMET</text>
      <text x="449" y="47" fill="#F0EEE7" font-family="system-ui" font-size="14" font-weight="600">GKMS Crops</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(90, 565)">
    <text x="0" y="16" fill="#898B83" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      Obsidian × Atmospheric Observatory • High-Precision Station Mesh
    </text>
    <text x="1020" y="16" fill="#C5A46D" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      INDIA • 2026
    </text>
  </g>
</svg>