    <meta property="og:title" content="MAUSAM — The Atmospheric Observatory" />

    <meta name="twitter:description" content="National meteorological observation, radar nowcasting, and environmental intelligence platform." />
    <meta name="twitter:image" content="https://mausamgovt.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="MAUSAM Weather and Radar Network" />

    <!-- Favicons and Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Consent Banner Styling -->
    <link rel="stylesheet" href="/css/consent.css" />

    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="/src/index.css" />

    <!-- Critical Atmospheric Observatory Shell (Zero Flash) -->
    <style>
      :root {
        color-scheme: dark light;
      }
      html, body {
        background-color: #0B0C0D;
        color: #F0EEE7;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: "Inter", "Manrope", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .skip-link {
        position: absolute !important;
        left: -9999px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
      }
      .skip-link:focus {
        position: fixed !important;
        left: 12px !important;
        top: 12px !important;
        width: auto !important;
        height: auto !important;
        z-index: 99999 !important;
        background: #C5A46D !important;
        color: #0B0C0D !important;
        padding: 8px 16px !important;
        border-radius: 7px !important;
        text-decoration: none !important;
        font-weight: 700 !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      @keyframes mausamSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Fonts & Icons Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Vanilla Client Scripts (Deferred, Privacy-Preserving) -->
    <script src="/js/consent.js" defer></script>
    <script src="/js/analytics.js" defer></script>
    <script src="/js/formValidation.js" defer></script>
    <script src="/js/seo.js" defer></script>
  </head>
  <body class="bg-[#0B0C0D] text-[#F0EEE7] antialiased selection:bg-[#C5A46D]/25 selection:text-[#F0EEE7]">
    <!-- Accessible Skip to Main Content Link -->
    <a
      href="#main-content"
      id="skip-link"
      class="skip-link sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:px-4 focus:py-2.5 focus:bg-[#C5A46D] focus:text-[#0B0C0D] focus:font-bold focus:text-sm focus:rounded-[7px] focus:shadow-xl focus:outline-none focus:ring-2 focus:ring-[#E0C18A]"
    >
      Skip to main content
    </a>

    <div id="root">
      <div
        id="mausam-boot-loader"
        role="status"
        aria-live="polite"
        style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background-color: #0B0C0D; color: #F0EEE7; font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; gap: 16px;"
      >
        <div
          id="mausam-boot-spinner"
          style="width: 34px; height: 34px; border: 2px solid rgba(226, 219, 200, 0.14); border-top-color: #C5A46D; border-radius: 50%; animation: mausamSpin 0.9s linear infinite;"
        ></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; max-width: 420px;">
          <div style="font-weight: 700; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #F0EEE7;">MAUSAM</div>
          <div
            id="mausam-boot-status"
            style="font-size: 12px; line-height: 1.5; color: #898B83; font-family: 'IBM Plex Mono', monospace;"
          >Initializing atmospheric observatory...</div>
          <div
            id="mausam-boot-actions"
            style="display: none; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;"
          ></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var WATCHDOG_TIMEOUT_MS = 12000;
        var mounted = false;
        var recoveryShown = false;
        var earlyErrorDetail = '';

        function clearCacheAndReload() {
          var statusEl = document.getElementById('mausam-boot-status');
          if (statusEl) {
            statusEl.textContent = 'Clearing cached observatory bundles and reloading...';
            statusEl.style.color = '#E6B96B';
          }
          var tasks = [];
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister().catch(function () { return false; });
                    })
                  );
                })
              );
            }
          } catch (e) {}
          try {
            if ('caches' in window && window.caches.keys) {
              tasks.push(
                window.caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return window.caches.delete(key).catch(function () { return false; });
                    })
                  );
                })
              );
            }
          } catch (e) {}
          Promise.all(tasks).finally(function () {
            try {
              var nextUrl = new URL(window.location.href);
              nextUrl.searchParams.set('_mausam_reload', String(Date.now()));
              window.location.replace(nextUrl.toString());
            } catch (e) {
              window.location.reload();
            }
          });
        }

        function showBootRecovery(reason) {
          if (mounted || recoveryShown) return;
          recoveryShown = true;
          var spinnerEl = document.getElementById('mausam-boot-spinner');
          var statusEl = document.getElementById('mausam-boot-status');
          var actionsEl = document.getElementById('mausam-boot-actions');
          if (!statusEl) return;

          if (spinnerEl) {
            spinnerEl.style.animation = 'none';
            spinnerEl.style.borderColor = 'rgba(245, 158, 11, 0.35)';
            spinnerEl.style.borderTopColor = '#F59E0B';
          }
          statusEl.style.color = '#F0EEE7';
          statusEl.textContent =
            reason ||
            earlyErrorDetail ||
            'Observatory startup took longer than 12 seconds. Cached application modules may be out of date.';

          if (actionsEl && actionsEl.childElementCount === 0) {
            actionsEl.style.display = 'flex';
            var clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.id = 'mausam-boot-clear-cache-btn';
            clearBtn.textContent = 'Clear Cache & Reload';
            clearBtn.style.cssText =
              'min-height:42px;padding:10px 18px;border-radius:8px;border:none;background:#C5A46D;color:#0B0C0D;font-family:Manrope,Inter,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.02em;cursor:pointer;';
            clearBtn.onclick = function () {
              clearBtn.disabled = true;
              clearBtn.style.opacity = '0.65';
              clearCacheAndReload();
            };

            var retryBtn = document.createElement('button');
            retryBtn.type = 'button';
            retryBtn.id = 'mausam-boot-retry-btn';
            retryBtn.textContent = 'Reload';
            retryBtn.style.cssText =
              'min-height:42px;padding:10px 16px;border-radius:8px;border:1px solid rgba(226,219,200,0.22);background:transparent;color:#F0EEE7;font-family:Manrope,Inter,sans-serif;font-size:12px;font-weight:600;cursor:pointer;';
            retryBtn.onclick = function () {
              window.location.reload();
            };

            actionsEl.appendChild(clearBtn);
            actionsEl.appendChild(retryBtn);
          }
        }

        window.__mausamClearCacheAndReload = clearCacheAndReload;
        window.__mausamShowBootRecovery = showBootRecovery;

        window.addEventListener('error', function (ev) {
          if (mounted) return;
          var msg = (ev && ev.message) ? String(ev.message) : '';
          if (msg.indexOf("Unexpected token '<'") !== -1 || msg.indexOf('Failed to fetch dynamically imported module') !== -1) {
            earlyErrorDetail =
              'A cached application module failed to load cleanly. Clear cache and reload to restore MAUSAM.';
          }
        });

        var timerId = window.setTimeout(function () {
          showBootRecovery();
        }, WATCHDOG_TIMEOUT_MS);

        window.addEventListener('mausam:react-mounted', function () {
          mounted = true;
          window.__MAUSAM_REACT_MOUNTED__ = true;
          window.clearTimeout(timerId);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
